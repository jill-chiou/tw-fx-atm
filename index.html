<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台灣外幣 ATM 地圖</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    header {
      background: #1a73e8;
      color: white;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    header h1 { font-size: 16px; font-weight: 600; }
    header .count { font-size: 13px; opacity: 0.85; margin-left: auto; }

    #filter-bar {
      background: #f8f9fa;
      border-bottom: 1px solid #ddd;
      padding: 8px 12px;
      overflow-x: auto;
      white-space: nowrap;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #filter-bar label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 12px;
      border: 1px solid #ccc;
      background: white;
      white-space: nowrap;
      user-select: none;
    }

    #filter-bar label.active {
      background: #1a73e8;
      border-color: #1a73e8;
      color: white;
    }

    #filter-bar label input { display: none; }

    #btn-all {
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid #aaa;
      background: white;
      cursor: pointer;
      flex-shrink: 0;
    }

    #map { flex: 1; }

    .popup-content { font-size: 13px; line-height: 1.6; }
    .popup-content strong { display: block; font-size: 14px; margin-bottom: 2px; }
    .popup-content .location { color: #555; }
    .popup-content .address { color: #333; margin-top: 2px; }

    #btn-locate {
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 12px;
      border: none;
      background: rgba(255,255,255,0.2);
      color: white;
      cursor: pointer;
      flex-shrink: 0;
    }
    #btn-locate:hover { background: rgba(255,255,255,0.3); }
    #btn-locate:disabled { opacity: 0.5; cursor: wait; }

    #nearby-panel {
      display: none;
      background: white;
      border-top: 2px solid #1a73e8;
      flex-shrink: 0;
      max-height: 220px;
      overflow-y: auto;
    }
    #nearby-panel.visible { display: block; }

    #nearby-header {
      position: sticky;
      top: 0;
      background: white;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #nearby-header button {
      font-size: 12px;
      border: none;
      background: none;
      cursor: pointer;
      color: #888;
    }

    .nearby-item {
      padding: 8px 12px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .nearby-item:hover { background: #f8f9fa; }
    .nearby-item-info { flex: 1; }
    .nearby-item-bank { font-weight: 600; }
    .nearby-item-addr { color: #666; font-size: 12px; margin-top: 2px; }
    .nearby-item-dist { color: #1a73e8; font-weight: 600; white-space: nowrap; font-size: 13px; }
  </style>
</head>
<body>

<header>
  <h1>台灣外幣 ATM 地圖</h1>
  <span class="count" id="visible-count"></span>
  <button id="btn-locate">定位</button>
</header>

<div id="filter-bar">
  <button id="btn-all">全選/全消</button>
</div>

<div id="map"></div>

<div id="nearby-panel">
  <div id="nearby-header">
    <span>附近的外幣 ATM</span>
    <button id="btn-close-nearby">關閉</button>
  </div>
  <div id="nearby-list"></div>
</div>

<script>
  const map = L.map("map").setView([23.97, 120.97], 8);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19,
  }).addTo(map);

  // 銀行 → 顯示名稱（修正 #N/A 和空值）
  function displayBank(record) {
    const name = record["銀行名稱"];
    if (!name || name === "#N/A") return `代號 ${record["代號"]}`;
    return name;
  }

  // 每間銀行一個固定顏色
  const PALETTE = [
    "#e53935","#8e24aa","#1e88e5","#00897b","#f4511e",
    "#6d4c41","#039be5","#43a047","#fb8c00","#3949ab",
    "#00acc1","#7cb342","#fdd835","#d81b60","#546e7a",
    "#c0ca33","#00bcd4","#ff7043",
  ];
  const bankColors = {};

  function getColor(bank) {
    if (!bankColors[bank]) {
      const idx = Object.keys(bankColors).length % PALETTE.length;
      bankColors[bank] = PALETTE[idx];
    }
    return bankColors[bank];
  }

  function makeIcon(color) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="36" viewBox="0 0 24 36">
      <path fill="${color}" stroke="white" stroke-width="1.5"
        d="M12 0C5.4 0 0 5.4 0 12c0 9 12 24 12 24s12-15 12-24C24 5.4 18.6 0 12 0z"/>
      <circle fill="white" cx="12" cy="12" r="5"/>
    </svg>`;
    return L.divIcon({
      html: svg,
      className: "",
      iconSize: [24, 36],
      iconAnchor: [12, 36],
      popupAnchor: [0, -36],
    });
  }

  // 直線距離（Haversine 公式），單位：公尺
  // 選擇直線而非步行距離的原因：
  // 1. 步行距離需要每筆打 routing API，1,939 筆同時算會很慢
  // 2. ATM finder 使用情境（幾百公尺內）直線 vs 步行差異不大
  // 3. Google Maps「附近」排序也是直線距離，只有點導航才算路線
  function haversine(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const toRad = x => x * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat/2)**2 +
              Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function formatDist(m) {
    return m < 1000 ? `${Math.round(m)} 公尺` : `${(m/1000).toFixed(1)} 公里`;
  }

  let userLat = null, userLng = null, userMarker = null;

  function setUserMarker(lat, lng) {
    if (userMarker) map.removeLayer(userMarker);
    userMarker = L.circleMarker([lat, lng], {
      radius: 9,
      color: "white",
      weight: 3,
      fillColor: "#1a73e8",
      fillOpacity: 1,
    }).addTo(map).bindPopup("你在這裡");
  }

  function showNearby() {
    if (userLat === null) return;
    const visible = allMarkers.filter(m => activeSet.has(m.bank));
    const sorted = visible
      .map(({ marker, bank, data }) => ({
        marker, bank, data,
        dist: haversine(userLat, userLng, parseFloat(data.lat), parseFloat(data.lng)),
      }))
      .sort((a, b) => a.dist - b.dist)
      .slice(0, 5);

    const list = document.getElementById("nearby-list");
    list.innerHTML = "";
    sorted.forEach(({ marker, bank, data, dist }) => {
      const item = document.createElement("div");
      item.className = "nearby-item";
      item.innerHTML = `
        <div class="nearby-item-info">
          <div class="nearby-item-bank">${bank}</div>
          <div class="nearby-item-addr">${data["裝設地點"] || ""} ${data["地址"] || ""}</div>
        </div>
        <div class="nearby-item-dist">${formatDist(dist)}</div>
      `;
      item.addEventListener("click", () => {
        map.setView([parseFloat(data.lat), parseFloat(data.lng)], 17);
        marker.openPopup();
      });
      list.appendChild(item);
    });

    document.getElementById("nearby-panel").classList.add("visible");
  }

  let allMarkers = [];    // [{marker, bank, data}]
  let activeSet = new Set();

  function updateCount() {
    const n = allMarkers.filter(m => activeSet.has(m.bank)).length;
    document.getElementById("visible-count").textContent = `顯示 ${n} 筆`;
  }

  function redrawMarkers() {
    allMarkers.forEach(({ marker, bank }) => {
      if (activeSet.has(bank)) {
        if (!map.hasLayer(marker)) marker.addTo(map);
      } else {
        if (map.hasLayer(marker)) map.removeLayer(marker);
      }
    });
    updateCount();
    showNearby();
  }

  fetch("data/processed/atm_geocoded.json")
    .then(r => r.json())
    .then(data => {
      // 只用有座標的筆
      const valid = data.filter(d => d.lat && d.lng);

      // 收集所有銀行（依出現順序）
      const banksOrdered = [];
      const seen = new Set();
      valid.forEach(d => {
        const b = displayBank(d);
        if (!seen.has(b)) { banksOrdered.push(b); seen.add(b); }
      });
      banksOrdered.sort();

      // 全部預設勾選
      banksOrdered.forEach(b => activeSet.add(b));

      // 建 checkbox UI
      const bar = document.getElementById("filter-bar");
      banksOrdered.forEach(bank => {
        const label = document.createElement("label");
        label.className = "active";
        label.title = bank;
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = true;
        cb.addEventListener("change", () => {
          if (cb.checked) { activeSet.add(bank); label.classList.add("active"); }
          else            { activeSet.delete(bank); label.classList.remove("active"); }
          redrawMarkers();
        });
        const dot = document.createElement("span");
        dot.style.cssText = `display:inline-block;width:8px;height:8px;border-radius:50%;background:${getColor(bank)};flex-shrink:0`;
        label.appendChild(cb);
        label.appendChild(dot);
        label.appendChild(document.createTextNode(" " + bank));
        bar.appendChild(label);
      });

      // 全選/全消
      document.getElementById("btn-all").addEventListener("click", () => {
        const allOn = banksOrdered.every(b => activeSet.has(b));
        bar.querySelectorAll("label").forEach((label, i) => {
          const cb = label.querySelector("input");
          if (cb) {
            cb.checked = !allOn;
            if (!allOn) { activeSet.add(banksOrdered[i]); label.classList.add("active"); }
            else        { activeSet.delete(banksOrdered[i]); label.classList.remove("active"); }
          }
        });
        redrawMarkers();
      });

      // 建 markers
      valid.forEach(d => {
        const bank = displayBank(d);
        const marker = L.marker([parseFloat(d.lat), parseFloat(d.lng)], {
          icon: makeIcon(getColor(bank)),
        });
        marker.bindPopup(`
          <div class="popup-content">
            <strong>${bank}</strong>
            <span class="location">${d["裝設地點"] || ""}</span>
            <span class="address">${d["地址"] || ""}</span>
          </div>
        `);
        allMarkers.push({ marker, bank, data: d });
      });

      redrawMarkers();

      // 定位按鈕
      document.getElementById("btn-locate").addEventListener("click", () => {
        if (!navigator.geolocation) {
          alert("你的瀏覽器不支援定位功能");
          return;
        }
        const btn = document.getElementById("btn-locate");
        btn.textContent = "定位中...";
        btn.disabled = true;
        navigator.geolocation.getCurrentPosition(
          pos => {
            userLat = pos.coords.latitude;
            userLng = pos.coords.longitude;
            setUserMarker(userLat, userLng);
            map.setView([userLat, userLng], 15);
            showNearby();
            btn.textContent = "重新定位";
            btn.disabled = false;
          },
          () => {
            alert("定位失敗，請確認已允許瀏覽器存取位置");
            btn.textContent = "定位";
            btn.disabled = false;
          }
        );
      });

      // 關閉附近面板
      document.getElementById("btn-close-nearby").addEventListener("click", () => {
        document.getElementById("nearby-panel").classList.remove("visible");
      });
    })
    .catch(err => {
      document.getElementById("map").innerHTML =
        `<p style="padding:20px;color:red">資料載入失敗：${err.message}<br>請用 python3 -m http.server 8000 啟動後再開啟</p>`;
    });
</script>

</body>
</html>
