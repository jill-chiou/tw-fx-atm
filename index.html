<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台灣外幣 ATM 地圖</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    header {
      background: #1a73e8;
      color: white;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    header h1 { font-size: 16px; font-weight: 600; }
    header .count { font-size: 13px; opacity: 0.85; margin-left: auto; }

    #filter-bar {
      background: #f8f9fa;
      border-bottom: 1px solid #ddd;
      padding: 8px 12px;
      overflow-x: auto;
      white-space: nowrap;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #filter-bar label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 12px;
      border: 1px solid #ccc;
      background: white;
      white-space: nowrap;
      user-select: none;
    }

    #filter-bar label.active {
      background: #1a73e8;
      border-color: #1a73e8;
      color: white;
    }

    #filter-bar label input { display: none; }

    #btn-all {
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid #aaa;
      background: white;
      cursor: pointer;
      flex-shrink: 0;
    }

    #map { flex: 1; }

    .popup-content { font-size: 13px; line-height: 1.6; }
    .popup-content strong { display: block; font-size: 14px; margin-bottom: 2px; }
    .popup-content .location { color: #555; }
    .popup-content .address { color: #333; margin-top: 2px; }
  </style>
</head>
<body>

<header>
  <h1>台灣外幣 ATM 地圖</h1>
  <span class="count" id="visible-count"></span>
</header>

<div id="filter-bar">
  <button id="btn-all">全選/全消</button>
</div>

<div id="map"></div>

<script>
  const map = L.map("map").setView([23.97, 120.97], 8);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19,
  }).addTo(map);

  // 銀行 → 顯示名稱（修正 #N/A 和空值）
  function displayBank(record) {
    const name = record["銀行名稱"];
    if (!name || name === "#N/A") return `代號 ${record["代號"]}`;
    return name;
  }

  // 每間銀行一個固定顏色
  const PALETTE = [
    "#e53935","#8e24aa","#1e88e5","#00897b","#f4511e",
    "#6d4c41","#039be5","#43a047","#fb8c00","#3949ab",
    "#00acc1","#7cb342","#fdd835","#d81b60","#546e7a",
    "#c0ca33","#00bcd4","#ff7043",
  ];
  const bankColors = {};

  function getColor(bank) {
    if (!bankColors[bank]) {
      const idx = Object.keys(bankColors).length % PALETTE.length;
      bankColors[bank] = PALETTE[idx];
    }
    return bankColors[bank];
  }

  function makeIcon(color) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="36" viewBox="0 0 24 36">
      <path fill="${color}" stroke="white" stroke-width="1.5"
        d="M12 0C5.4 0 0 5.4 0 12c0 9 12 24 12 24s12-15 12-24C24 5.4 18.6 0 12 0z"/>
      <circle fill="white" cx="12" cy="12" r="5"/>
    </svg>`;
    return L.divIcon({
      html: svg,
      className: "",
      iconSize: [24, 36],
      iconAnchor: [12, 36],
      popupAnchor: [0, -36],
    });
  }

  let allMarkers = [];    // [{marker, bank}]
  let activeSet = new Set();

  function updateCount() {
    const n = allMarkers.filter(m => activeSet.has(m.bank)).length;
    document.getElementById("visible-count").textContent = `顯示 ${n} 筆`;
  }

  function redrawMarkers() {
    allMarkers.forEach(({ marker, bank }) => {
      if (activeSet.has(bank)) {
        if (!map.hasLayer(marker)) marker.addTo(map);
      } else {
        if (map.hasLayer(marker)) map.removeLayer(marker);
      }
    });
    updateCount();
  }

  fetch("data/processed/atm_geocoded.json")
    .then(r => r.json())
    .then(data => {
      // 只用有座標的筆
      const valid = data.filter(d => d.lat && d.lng);

      // 收集所有銀行（依出現順序）
      const banksOrdered = [];
      const seen = new Set();
      valid.forEach(d => {
        const b = displayBank(d);
        if (!seen.has(b)) { banksOrdered.push(b); seen.add(b); }
      });
      banksOrdered.sort();

      // 全部預設勾選
      banksOrdered.forEach(b => activeSet.add(b));

      // 建 checkbox UI
      const bar = document.getElementById("filter-bar");
      banksOrdered.forEach(bank => {
        const label = document.createElement("label");
        label.className = "active";
        label.title = bank;
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = true;
        cb.addEventListener("change", () => {
          if (cb.checked) { activeSet.add(bank); label.classList.add("active"); }
          else            { activeSet.delete(bank); label.classList.remove("active"); }
          redrawMarkers();
        });
        const dot = document.createElement("span");
        dot.style.cssText = `display:inline-block;width:8px;height:8px;border-radius:50%;background:${getColor(bank)};flex-shrink:0`;
        label.appendChild(cb);
        label.appendChild(dot);
        label.appendChild(document.createTextNode(" " + bank));
        bar.appendChild(label);
      });

      // 全選/全消
      document.getElementById("btn-all").addEventListener("click", () => {
        const allOn = banksOrdered.every(b => activeSet.has(b));
        bar.querySelectorAll("label").forEach((label, i) => {
          const cb = label.querySelector("input");
          if (cb) {
            cb.checked = !allOn;
            if (!allOn) { activeSet.add(banksOrdered[i]); label.classList.add("active"); }
            else        { activeSet.delete(banksOrdered[i]); label.classList.remove("active"); }
          }
        });
        redrawMarkers();
      });

      // 建 markers
      valid.forEach(d => {
        const bank = displayBank(d);
        const marker = L.marker([parseFloat(d.lat), parseFloat(d.lng)], {
          icon: makeIcon(getColor(bank)),
        });
        marker.bindPopup(`
          <div class="popup-content">
            <strong>${bank}</strong>
            <span class="location">${d["裝設地點"] || ""}</span>
            <span class="address">${d["地址"] || ""}</span>
          </div>
        `);
        allMarkers.push({ marker, bank });
      });

      redrawMarkers();
    })
    .catch(err => {
      document.getElementById("map").innerHTML =
        `<p style="padding:20px;color:red">資料載入失敗：${err.message}<br>請用 python3 -m http.server 8000 啟動後再開啟</p>`;
    });
</script>

</body>
</html>
